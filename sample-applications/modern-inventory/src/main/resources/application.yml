spring:
  application:
    name: modern-inventory
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:moderninventory;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
server:
  port: ${PORT:8081}
