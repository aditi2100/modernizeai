name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt
        working-directory: backend
      - run: pytest
        working-directory: backend
  legacy-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          mkdir -p /tmp/legacy-classes
          javac -d /tmp/legacy-classes sample-applications/legacy-inventory/src/main/java/com/modernizeai/legacy/*.java
          java -cp /tmp/legacy-classes com.modernizeai.legacy.InventoryApp --self-test
  modern-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: sample-applications/modern-inventory/pom.xml
      - run: mvn --batch-mode test
        working-directory: sample-applications/modern-inventory
